<!-- App icon. Replaces the Vite scaffold logo that shipped here by accident and
     was being used as the browser favicon, the web-push notification icon
     (utils/notifications.js, sw.js) and — once a manifest existed — would have
     become the home-screen icon too.

     Deliberately plain: a checkmark on the app's own brand red (#dc2626, the
     --brand-primary token). It has to stay legible at 16px in a browser tab,
     so there is one shape and no detail. The padded viewBox leaves room for
     Android's maskable safe zone, which crops to a circle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#dc2626"/>
  <path d="M148 262l74 74 142-160"
        fill="none"
        stroke="#ffffff"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
